<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <filter id="text-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" />

  <g opacity="0.05" stroke="#22d3ee" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <rect width="1200" height="1" fill="url(#glow)" opacity="0.1" y="0">
    <animate attributeName="y" values="0;300;0" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite" />
  </rect>

  <g>
    <circle cx="100" cy="50" r="1.5" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50;30;50" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="250" r="1" fill="#5eead4" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;220;250" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="80" r="2" fill="#67e8f9" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;50;80" dur="5s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="200" r="1.5" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="200;170;200" dur="4.5s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="100" r="1" fill="#a7f3d0" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;70;100" dur="3s" begin="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="260" r="1.8" fill="#5eead4" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="260;230;260" dur="4s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="180" r="1.2" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3.8s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180;150;180" dur="3.8s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="40" r="1" fill="#67e8f9" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="4.2s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="40;15;40" dur="4.2s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="280" r="1.5" fill="#a7f3d0" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="5s" begin="2.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="280;250;280" dur="5s" begin="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="420" cy="160" r="1.3" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="3.2s" begin="1.8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="160;130;160" dur="3.2s" begin="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="600" y="125" text-anchor="middle" font-family="SF Pro Display, Segoe UI, system-ui, -apple-system, sans-serif" font-size="56" font-weight="650" fill="url(#glow)" filter="url(#text-glow)">
    Vishwas Kothari
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze" />
  </text>

  <text x="600" y="175" text-anchor="middle" font-family="SF Mono, Fira Code, JetBrains Mono, monospace" font-size="16" fill="#94a3b8" letter-spacing="2">
    Explainable AI | Research | Data Engineering
    <animate attributeName="opacity" values="0;0;1" dur="2.4s" fill="freeze" />
  </text>

  <rect x="818" y="161" width="2" height="18" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" begin="2.5s" repeatCount="indefinite" />
  </rect>

  <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0.4" dur="2s" fill="freeze" />
    <polyline points="30,50 30,30 50,30" />
    <polyline points="1150,30 1170,30 1170,50" />
    <polyline points="30,250 30,270 50,270" />
    <polyline points="1150,270 1170,270 1170,250" />
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0.55" dur="3s" fill="freeze" />
    <text x="600" y="230" text-anchor="middle" font-family="SF Mono, Fira Code, monospace" font-size="11" fill="#64748b" letter-spacing="3">
      BUILDING TRUSTWORTHY AI SYSTEMS
    </text>
    <circle cx="420" cy="226" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
