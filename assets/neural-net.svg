<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <rect width="280" height="280" fill="#0a0a0a" rx="14"/>
  <!-- Layer 1 -->
  <circle cx="80" cy="55" r="5" fill="#c9b37e" opacity="0.9"/>
  <circle cx="140" cy="55" r="5" fill="#c9b37e" opacity="0.6"/>
  <circle cx="200" cy="55" r="5" fill="#c9b37e" opacity="0.3"/>
  <!-- Layer 2 -->
  <circle cx="60" cy="140" r="5" fill="#9caf88" opacity="0.3"/>
  <circle cx="120" cy="140" r="5" fill="#9caf88" opacity="0.7"/>
  <circle cx="180" cy="140" r="5" fill="#9caf88" opacity="0.9"/>
  <circle cx="220" cy="140" r="5" fill="#9caf88" opacity="0.5"/>
  <!-- Layer 3 -->
  <circle cx="100" cy="225" r="5" fill="#e8e3d3" opacity="0.8"/>
  <circle cx="180" cy="225" r="5" fill="#e8e3d3" opacity="0.4"/>
  <!-- Connections -->
  <g stroke-width="1" opacity="0.12">
    <line x1="80" y1="55" x2="60" y2="140" stroke="#c9b37e"/>
    <line x1="80" y1="55" x2="120" y2="140" stroke="#c9b37e"/>
    <line x1="140" y1="55" x2="120" y2="140" stroke="#c9b37e"/>
    <line x1="140" y1="55" x2="180" y2="140" stroke="#c9b37e"/>
    <line x1="200" y1="55" x2="180" y2="140" stroke="#c9b37e"/>
    <line x1="200" y1="55" x2="220" y2="140" stroke="#c9b37e"/>
    <line x1="60" y1="140" x2="100" y2="225" stroke="#9caf88"/>
    <line x1="120" y1="140" x2="100" y2="225" stroke="#9caf88"/>
    <line x1="180" y1="140" x2="180" y2="225" stroke="#9caf88"/>
    <line x1="220" y1="140" x2="180" y2="225" stroke="#9caf88"/>
  </g>
</svg>
