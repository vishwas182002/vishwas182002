<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">3D contribution graph placeholder</title>
  <desc id="desc">A dark 3D-style contribution graph placeholder for the GitHub profile README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0d0d"/>
      <stop offset="0.58" stop-color="#151515"/>
      <stop offset="1" stop-color="#2b261f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2efe8"/>
      <stop offset="0.45" stop-color="#b7ab98"/>
      <stop offset="1" stop-color="#5b5247"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#b7ab98" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <text x="70" y="78" fill="#e0ddd6" font-family="Arial, sans-serif" font-size="30" font-weight="700">Contribution Field</text>
  <text x="70" y="108" fill="#8a8780" font-family="Arial, sans-serif" font-size="15">3D activity terrain · generated SVG ready</text>
  <g transform="translate(118 148) skewX(-22)" filter="url(#glow)">
    <path d="M0 170H900" stroke="#b7ab98" stroke-opacity="0.18"/>
    <g opacity="0.95">
      <rect x="0" y="145" width="18" height="25" fill="url(#bar)" opacity="0.28"/>
      <rect x="28" y="124" width="18" height="46" fill="url(#bar)" opacity="0.55"/>
      <rect x="56" y="92" width="18" height="78" fill="url(#bar)" opacity="0.86"/>
      <rect x="84" y="132" width="18" height="38" fill="url(#bar)" opacity="0.42"/>
      <rect x="126" y="112" width="18" height="58" fill="url(#bar)" opacity="0.68"/>
      <rect x="154" y="78" width="18" height="92" fill="url(#bar)" opacity="0.98"/>
      <rect x="182" y="102" width="18" height="68" fill="url(#bar)" opacity="0.78"/>
      <rect x="224" y="142" width="18" height="28" fill="url(#bar)" opacity="0.34"/>
      <rect x="252" y="116" width="18" height="54" fill="url(#bar)" opacity="0.63"/>
      <rect x="280" y="88" width="18" height="82" fill="url(#bar)" opacity="0.9"/>
      <rect x="308" y="128" width="18" height="42" fill="url(#bar)" opacity="0.48"/>
      <rect x="350" y="106" width="18" height="64" fill="url(#bar)" opacity="0.74"/>
      <rect x="378" y="70" width="18" height="100" fill="url(#bar)" opacity="1"/>
      <rect x="406" y="94" width="18" height="76" fill="url(#bar)" opacity="0.84"/>
      <rect x="448" y="136" width="18" height="34" fill="url(#bar)" opacity="0.38"/>
      <rect x="476" y="110" width="18" height="60" fill="url(#bar)" opacity="0.7"/>
      <rect x="504" y="82" width="18" height="88" fill="url(#bar)" opacity="0.96"/>
      <rect x="532" y="122" width="18" height="48" fill="url(#bar)" opacity="0.56"/>
      <rect x="574" y="144" width="18" height="26" fill="url(#bar)" opacity="0.32"/>
      <rect x="602" y="118" width="18" height="52" fill="url(#bar)" opacity="0.62"/>
      <rect x="630" y="90" width="18" height="80" fill="url(#bar)" opacity="0.88"/>
      <rect x="672" y="126" width="18" height="44" fill="url(#bar)" opacity="0.5"/>
      <rect x="700" y="104" width="18" height="66" fill="url(#bar)" opacity="0.76"/>
      <rect x="728" y="74" width="18" height="96" fill="url(#bar)" opacity="0.99"/>
      <rect x="756" y="98" width="18" height="72" fill="url(#bar)" opacity="0.82"/>
      <rect x="798" y="138" width="18" height="32" fill="url(#bar)" opacity="0.36"/>
      <rect x="826" y="114" width="18" height="56" fill="url(#bar)" opacity="0.66"/>
      <rect x="854" y="86" width="18" height="84" fill="url(#bar)" opacity="0.92"/>
    </g>
  </g>
  <text x="70" y="360" fill="#8a8780" font-family="Arial, sans-serif" font-size="13">Run the GitHub Action once to replace this fallback with your live 3D contribution graph.</text>
</svg>
